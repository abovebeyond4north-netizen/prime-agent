name: Android Agent APK

on:
  push:
    branches:
      - feature/android-agent
    paths:
      - "android-agent/**"
      - ".github/workflows/android-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p android-agent :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: codie-ai-debug-apk
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
