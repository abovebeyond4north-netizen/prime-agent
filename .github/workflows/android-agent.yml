name: Android Agent APK
run-name: "Android Agent APK · ${{ github.event.github.event.inputs.source_ref || github.ref_name }}"

on:
  push:
    branches:
      - feature/android-agent
    paths:
      - "android-agent/**"
      - ".github/workflows/android-agent.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional codie-selfdev/** source ref to build in the trusted workflow context"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preserve Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: codie-ai-debug-keystore-v2

      - name: Ensure persistent Android debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Codie AI Debug,O=Codie AI,C=CA"
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p android-agent :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: codie-ai-debug-apk
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
