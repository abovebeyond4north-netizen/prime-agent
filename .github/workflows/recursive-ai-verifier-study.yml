name: Recursive AI varied holdout and verifier study

on:
  push:
    branches: [recursive-ai/selector-replications]
    paths: [".github/workflows/recursive-ai-verifier-study.yml", "recursive-ai/research/verifier_ablation.py", "recursive-ai/tests/test_verifier_ablation.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [310003, 510007, 710009]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Run matched selectors
        working-directory: recursive-ai
        env:
          STUDY_SEED: ${{ matrix.seed }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import platform
          import subprocess
          import time
          from pathlib import Path
          from research.selection_comparison import compare_parent_selection
          start = time.monotonic()
          root = Path('selector-evidence')
          root.mkdir()
          provenance = {
              'commit': os.environ['GITHUB_SHA'],
              'seed': int(os.environ['STUDY_SEED']),
              'python': platform.python_version(),
              'platform': platform.platform(),
              'docker_image_id': subprocess.check_output(
                  ['docker', 'image', 'inspect', '--format', '{{.Id}}',
                   'recursive-ai-runner:local'], text=True).strip(),
              'acceptance': 'All integrity canaries and audited correctness required; no automatic promotion.',
              'limitations': ['Same operator and runner image across replications.',
                             'Seeded compound expressions vary tasks; one grammar is not an external task distribution.',
                             'Wall time can influence development selection; report machine confounding.'],
          }
          (root / 'provenance.json').write_text(json.dumps(provenance, indent=2))
          report = compare_parent_selection(
              root, train_goal='sorted search', holdout_goal='compound arithmetic',
              tier=1, population=4, generations=2, development_replicates=1,
              holdout_replicates=2, base_seed=provenance['seed'], task_count=3,
              max_attempts=24, max_seconds=180, max_stagnation=12,
              max_model_calls=0, max_containers=400,
          )
          report['elapsed_seconds'] = time.monotonic() - start
          report['provenance'] = provenance
          print('SELECTOR_RESULT ' + json.dumps(report, sort_keys=True))
          (root / 'result.json').write_text(json.dumps(report, indent=2))
          assert report['evaluation_integrity_canaries']['all_passed']
          assert report['holdout_comparison_pareto_minus_quality_diversity']['all_correct']
          assert report['promotion']['automatic'] is False
          PYTHON
      - name: Preserve evidence, including failed studies
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varied-holdout-evidence-${{ matrix.seed }}
          path: recursive-ai/selector-evidence/**/*.json
          if-no-files-found: error
          retention-days: 30

  verifier-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Check ablation protocol
        working-directory: recursive-ai
        run: python3 -m unittest tests.test_verifier_ablation -v
      - name: Run real Docker ablation
        working-directory: recursive-ai
        run: python3 -m research.verifier_ablation --output verifier-ablation.json
      - name: Preserve ablation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verifier-ablation-evidence
          path: recursive-ai/verifier-ablation.json
          if-no-files-found: error
          retention-days: 30
