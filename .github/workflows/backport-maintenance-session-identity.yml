name: Backport maintenance session identity

on:
  push:
    branches:
      - fix/maintenance-session-identity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/maintenance-session-identity

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Apply upstream maintenance identity fix
        run: python .github/scripts/backport_maintenance_session_identity_v2.py

      - name: Validate backport
        run: |
          git diff --check
          npm ci --ignore-scripts
          npm run build
          npm run check
          npx vitest --run packages/coding-agent/test/suite/regressions/6009-opencode-maintenance-session.test.ts

      - name: Commit validated patch
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          for required in \
            packages/coding-agent/.changes/maintenance-session-identity.md \
            packages/coding-agent/src/core/agent-session.ts \
            packages/coding-agent/src/core/compaction/branch-summarization.ts \
            packages/coding-agent/src/core/compaction/compaction.ts \
            packages/coding-agent/src/core/refinement/refinement.ts \
            packages/coding-agent/test/suite/regressions/6009-opencode-maintenance-session.test.ts; do
            echo "$changed" | grep -Fx "$required"
          done
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 6
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/coding-agent/.changes/maintenance-session-identity.md \
            packages/coding-agent/src/core/agent-session.ts \
            packages/coding-agent/src/core/compaction/branch-summarization.ts \
            packages/coding-agent/src/core/compaction/compaction.ts \
            packages/coding-agent/src/core/refinement/refinement.ts \
            packages/coding-agent/test/suite/regressions/6009-opencode-maintenance-session.test.ts
          git commit -m "fix: retain session identity for maintenance calls"
          git push origin HEAD:fix/maintenance-session-identity
