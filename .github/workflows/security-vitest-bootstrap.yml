name: Security Vitest bootstrap

on:
  push:
    branches:
      - security/patch-vitest-4.1.11

permissions:
  contents: write

jobs:
  patch-vitest:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: security/patch-vitest-4.1.11
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Generate and normalize Vitest 4.1.11 patch
        run: |
          git fetch origin main
          npm install --global npm@12.0.2
          npm --version | grep -Eq '^12\.0\.2$'
          npm install --package-lock-only --ignore-scripts --save-dev \
            --workspace @earendil-works/pi-agent-core \
            --workspace @earendil-works/pi-ai \
            --workspace @earendil-works/pi-coding-agent \
            vitest@4.1.11

          cp package-lock.json /tmp/generated-lock.json
          git checkout origin/main -- package-lock.json packages/agent/package.json packages/ai/package.json packages/coding-agent/package.json

          node <<'NODE'
          const fs = require('node:fs');
          const generated = JSON.parse(fs.readFileSync('/tmp/generated-lock.json', 'utf8'));
          const base = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const records = [
            'node_modules/@vitest/expect',
            'node_modules/@vitest/mocker',
            'node_modules/@vitest/pretty-format',
            'node_modules/@vitest/runner',
            'node_modules/@vitest/snapshot',
            'node_modules/@vitest/spy',
            'node_modules/@vitest/utils',
            'node_modules/vitest',
            'packages/agent',
            'packages/ai',
            'packages/coding-agent',
          ];
          for (const key of records) {
            if (!generated.packages[key]) throw new Error(`missing generated lock record: ${key}`);
            base.packages[key] = generated.packages[key];
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(base, null, '\t') + '\n');

          for (const file of [
            'packages/agent/package.json',
            'packages/ai/package.json',
            'packages/coding-agent/package.json',
          ]) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replace('"vitest": "^4.1.10"', '"vitest": "^4.1.11"');
            if (after === before) throw new Error(`Vitest range not found in ${file}`);
            fs.writeFileSync(file, after);
          }
          NODE

          test "$(node -p "require('./packages/agent/package.json').devDependencies.vitest")" = "^4.1.11"
          test "$(node -p "require('./packages/ai/package.json').devDependencies.vitest")" = "^4.1.11"
          test "$(node -p "require('./packages/coding-agent/package.json').devDependencies.vitest")" = "^4.1.11"
          test "$(node -p "require('./package-lock.json').packages['node_modules/vitest'].version")" = "4.1.11"
          test "$(node -p "require('./package-lock.json').packages['node_modules/@vitest/mocker'].version")" = "4.1.11"

          changed="$(git diff --name-only)"
          expected=$'package-lock.json\npackages/agent/package.json\npackages/ai/package.json\npackages/coding-agent/package.json'
          test "$changed" = "$expected"

          npm ci --ignore-scripts
          npm ls vitest @vitest/mocker --all
          set +e
          npm audit --json > /tmp/audit.json
          audit_status=$?
          set -e
          node <<'NODE'
          const report = require('/tmp/audit.json');
          const names = Object.keys(report.vulnerabilities ?? {});
          if (names.length !== 1 || names[0] !== 'extract-zip') {
            throw new Error(`expected only extract-zip audit finding, got: ${names.join(', ')}`);
          }
          NODE
          echo "Expected remaining audit status: ${audit_status}"

      - name: Commit minimal patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/agent/package.json packages/ai/package.json packages/coding-agent/package.json
          git commit -m "security: patch Vitest to 4.1.11"
          git push origin HEAD:security/patch-vitest-4.1.11
