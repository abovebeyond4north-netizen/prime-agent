name: Recursive AI feedback boundary study
on:
  push:
    branches: [recursive-ai/selector-replications]
    paths: [".github/workflows/recursive-ai-feedback-boundary.yml"]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: numeric
            goal: number theory
            expected_advantage: true
          - label: search
            goal: sorted search
            expected_advantage: true
          - label: single-prerequisite
            goal: compound arithmetic
            expected_advantage: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Compare early certification and retained completion
        working-directory: recursive-ai
        env:
          STUDY_GOAL: ${{ matrix.goal }}
          EXPECTED_ADVANTAGE: ${{ matrix.expected_advantage }}
        run: |
          python3 - <<'PY'
          import contextlib
          import json
          import os
          from pathlib import Path
          from autonomy.controller import execute_goal
          from autonomy.curriculum import certified
          from autonomy.memory import ResearchMemory
          from autonomy.tasks import goal_contract
          from autonomy.verifier import TaskVerifier
          from core.rollback import VersionController
          from sandbox.runner import SandboxRunner
          evidence = Path('feedback-boundary-evidence')
          evidence.mkdir()
          goal = os.environ['STUDY_GOAL']
          expected = os.environ['EXPECTED_ADVANTAGE'] == 'true'
          contract = goal_contract(goal, tier=1, task_seed=101, task_count=3)
          rows = {}
          for mode, focused in [('control', False), ('public_failure_focus', True)]:
              root = evidence / mode
              with (evidence / (mode + '.jsonl')).open('w') as trace, contextlib.redirect_stdout(trace):
                  early = execute_goal(root, description=goal, tier=1, task_seed=101, task_count=3,
                                       max_attempts=32, max_seconds=180, max_containers=16,
                                       max_model_calls=0, repair_public_failures=focused)
                  memory = ResearchMemory(root)
                  checkpoint = memory.current()
                  active = certified(VersionController(root).read(checkpoint)) if checkpoint else {}
                  memory.db.close()
                  audit_runner = SandboxRunner()
                  audit = None
                  if active:
                      audit_runner.boot()
                      audit = TaskVerifier(audit_runner).audit(active, contract)
                  final = execute_goal(root, description=goal, tier=1, task_seed=101, task_count=3,
                                       max_attempts=32, max_seconds=300, max_containers=800,
                                       max_model_calls=0, repair_public_failures=focused)
              rows[mode] = {'early': early, 'separate_audit': audit,
                            'audit_containers': audit_runner.container_runs, 'final': final}
              assert early['container_runs'] == 16
              assert not active or audit['passed']
              assert final['status'] == 'goal_reached' and final['audit']['passed']
              assert set(early['certified_tasks']).issubset(final['certified_tasks'])
          delta = rows['public_failure_focus']['early']['coverage'] - rows['control']['early']['coverage']
          result = {'code_commit': os.environ['GITHUB_SHA'], 'goal': goal, 'rows': rows,
                    'early_coverage_delta': delta, 'expected_advantage': expected,
                    'limitations': ['Internal finite task families and generated expressions, not external environments.',
                                    'One run per arm per suite; these suites overlap the original toolkit.',
                                    'Container cap is a compute proxy; diagnostic audits are extra and reported.',
                                    'Negative condition has one eligible prerequisite, so ordering should not help.']}
          (evidence / 'result.json').write_text(json.dumps(result, indent=2))
          print('BOUNDARY_RESULT ' + json.dumps(result, sort_keys=True))
          assert delta > 0 if expected else delta == 0
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: feedback-boundary-${{ matrix.label }}
          path: recursive-ai/feedback-boundary-evidence/**
          if-no-files-found: error
          retention-days: 30
