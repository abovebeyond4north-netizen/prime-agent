name: x402 directory registration

on:
  push:
    branches: [main]
    paths:
      - "tools/x402-provider/**"
      - ".github/workflows/x402-directory-registration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x402-directory-registration
  cancel-in-progress: true

jobs:
  market402:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE_URL: https://prime-agent-x402-provider.onrender.com
      OPERATOR_JSON: https://market402.com/op/prime-agent-x402-provider.onrender.com.json
    steps:
      - name: Wait for paid production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "$BASE_URL/health" -o /tmp/health.json; then
              mode="$(python3 -c 'import json; print(json.load(open("/tmp/health.json")).get("mode") or "")')"
              deployed="$(python3 -c 'import json; print(json.load(open("/tmp/health.json")).get("gitCommit") or "")')"
              echo "mode=$mode deployed=$deployed expected=$GITHUB_SHA"
              if [ "$mode" = "x402-paid" ] && [ "$deployed" = "$GITHUB_SHA" ]; then
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Production did not reach the paid current-main deployment." >&2
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Run free Market402 self-tests
        shell: bash
        run: |
          set -euo pipefail
          for resource in "$BASE_URL/v1/token/verdict" "$BASE_URL/v1/x402/opportunities"; do
            echo "Self-testing $resource"
            payload="$(python3 -c 'import json,sys; print(json.dumps({"url": sys.argv[1]}))' "$resource")"
            curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 45               -X POST https://market402.com/selftest               -H 'content-type: application/json'               --data "$payload"
            echo
          done

      - name: Submit missing endpoints to Market402
        shell: bash
        run: |
          set -euo pipefail

          existing=""
          if curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "$OPERATOR_JSON" -o /tmp/operator.json; then
            existing="$(cat /tmp/operator.json)"
          fi

          submit_if_missing() {
            resource="$1"
            if [ -n "$existing" ] && printf '%s' "$existing" | grep -Fq "$resource"; then
              echo "Already present in Market402: $resource"
              return 0
            fi

            payload="$(python3 -c 'import json,sys; print(json.dumps({"resource": sys.argv[1], "declared_price_usd": 0.01}))' "$resource")"
            body_file="$(mktemp)"
            status="$(
              curl --silent --show-error --connect-timeout 10 --max-time 45                 -o "$body_file" -w '%{http_code}'                 -X POST https://market402.com/submit                 -H 'content-type: application/json'                 --data "$payload"
            )"
            cat "$body_file"
            echo
            rm -f "$body_file"

            case "$status" in
              200|201|409)
                echo "Market402 registration status=$status for $resource"
                ;;
              *)
                echo "Market402 submission failed with HTTP $status for $resource" >&2
                exit 1
                ;;
            esac
          }

          submit_if_missing "$BASE_URL/v1/token/verdict"
          submit_if_missing "$BASE_URL/v1/x402/opportunities"
