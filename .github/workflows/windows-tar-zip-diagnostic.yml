name: Windows ZIP extraction diagnostic

on:
  push:
    branches:
      - security/validate-windows-tar-zip

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Inspect Windows archive tools
        shell: pwsh
        run: |
          Get-Command tar | Format-List Name,Source,Version
          tar --version
          Get-Command powershell.exe | Format-List Name,Source,Version
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Build regular and malicious ZIP fixtures
        shell: pwsh
        run: |
          @'
          import os, stat, zipfile
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'prime-agent-zip-diagnostic'
          root.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(root / 'regular.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('ripgrep-15.1.0-x86_64-pc-windows-msvc/rg.exe', b'prime-agent-test-binary')

          with zipfile.ZipFile(root / 'traversal.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('../escaped.txt', b'escape-attempt')
              z.writestr('safe.txt', b'safe')

          with zipfile.ZipFile(root / 'symlink.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              link = zipfile.ZipInfo('link')
              link.create_system = 3
              link.external_attr = (stat.S_IFLNK | 0o777) << 16
              z.writestr(link, '../outside')
              z.writestr('link/pwn.txt', b'symlink-escape-attempt')
          '@ | python -

      - name: Preserve evidence that bsdtar blocks parent traversal
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'prime-agent-zip-diagnostic'
          $out = Join-Path $root 'tar-traversal-out'
          $escaped = Join-Path $root 'escaped.txt'
          Remove-Item -LiteralPath $escaped -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          tar -xf (Join-Path $root 'traversal.zip') -C $out 2>&1 | Write-Host
          $status = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (Test-Path -LiteralPath $escaped) { throw 'bsdtar wrote ../escaped.txt outside the extraction root' }
          if ($status -eq 0) { throw 'bsdtar accepted a ZIP containing a parent traversal entry' }
          Write-Host "bsdtar rejected parent traversal with exit status $status."

      - name: Preserve evidence that bsdtar follows ZIP symlink paths
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'prime-agent-zip-diagnostic'
          $out = Join-Path $root 'tar-symlink-out'
          $outside = Join-Path $root 'outside'
          $escaped = Join-Path $outside 'pwn.txt'
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $outside -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          New-Item -ItemType Directory -Force -Path $outside | Out-Null
          tar -xf (Join-Path $root 'symlink.zip') -C $out 2>&1 | Write-Host
          $status = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (-not (Test-Path -LiteralPath $escaped -PathType Leaf)) {
            throw 'expected diagnostic bsdtar symlink escape was not reproduced'
          }
          Write-Host "bsdtar symlink escape reproduced with exit status $status; tar is rejected as a production replacement."
          Remove-Item -LiteralPath $outside -Recurse -Force

      - name: Verify PowerShell extracts a regular ZIP
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'prime-agent-zip-diagnostic'
          $out = Join-Path $root 'ps-regular-out'
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:PRIME_AGENT_ARCHIVE = Join-Path $root 'regular.zip'
          $env:PRIME_AGENT_DEST = $out
          powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; Expand-Archive -LiteralPath $env:PRIME_AGENT_ARCHIVE -DestinationPath $env:PRIME_AGENT_DEST -Force'
          if ($LASTEXITCODE -ne 0) { throw "Expand-Archive regular extraction failed: $LASTEXITCODE" }
          $binary = Join-Path $out 'ripgrep-15.1.0-x86_64-pc-windows-msvc\rg.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Expand-Archive did not produce rg.exe' }
          if ((Get-Content -LiteralPath $binary -Raw) -ne 'prime-agent-test-binary') { throw 'Expand-Archive content mismatch' }

      - name: Prove PowerShell blocks parent traversal
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'prime-agent-zip-diagnostic'
          $out = Join-Path $root 'ps-traversal-out'
          $escaped = Join-Path $root 'escaped.txt'
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $escaped -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:PRIME_AGENT_ARCHIVE = Join-Path $root 'traversal.zip'
          $env:PRIME_AGENT_DEST = $out
          powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; Expand-Archive -LiteralPath $env:PRIME_AGENT_ARCHIVE -DestinationPath $env:PRIME_AGENT_DEST -Force' 2>&1 | Write-Host
          $status = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (Test-Path -LiteralPath $escaped) { throw 'Expand-Archive wrote ../escaped.txt outside the extraction root' }
          if ($status -eq 0) { throw 'Expand-Archive accepted a ZIP containing a parent traversal entry' }
          Write-Host "Expand-Archive rejected parent traversal with exit status $status; no outside write occurred."

      - name: Prove PowerShell does not follow ZIP symlink metadata
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'prime-agent-zip-diagnostic'
          $out = Join-Path $root 'ps-symlink-out'
          $outside = Join-Path $root 'outside'
          $escaped = Join-Path $outside 'pwn.txt'
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $outside -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          New-Item -ItemType Directory -Force -Path $outside | Out-Null
          $env:PRIME_AGENT_ARCHIVE = Join-Path $root 'symlink.zip'
          $env:PRIME_AGENT_DEST = $out
          powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; Expand-Archive -LiteralPath $env:PRIME_AGENT_ARCHIVE -DestinationPath $env:PRIME_AGENT_DEST -Force' 2>&1 | Write-Host
          $status = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (Test-Path -LiteralPath $escaped) { throw 'Expand-Archive followed ZIP symlink metadata outside the extraction root' }
          if ($status -eq 0) {
            $linkPath = Join-Path $out 'link'
            if (-not (Test-Path -LiteralPath $linkPath -PathType Leaf)) { throw 'successful extraction did not materialize the symlink entry as a regular file' }
            Write-Host 'Expand-Archive materialized the ZIP symlink entry as a regular file and kept all writes inside the extraction root.'
          } else {
            Write-Host "Expand-Archive rejected the ZIP symlink fixture with exit status $status; no outside write occurred."
          }
