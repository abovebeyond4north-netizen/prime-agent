name: Extract ZIP security bootstrap

on:
  push:
    branches:
      - security/remove-extract-zip

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: security/remove-extract-zip

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Apply minimal production and test patch
        run: python .github/scripts/security_extract_zip_patch.py

      - name: Regenerate lockfile after dependency removal
        run: |
          npm install --package-lock-only --ignore-scripts
          test -z "$(git diff --name-only -- package.json packages/agent/package.json packages/ai/package.json packages/tui/package.json)"

      - name: Validate patched tree
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run check
          npx vitest --run packages/coding-agent/test/tools-manager.test.ts
          node - <<'NODE'
          try {
            require.resolve('extract-zip/package.json');
            throw new Error('extract-zip is still installed');
          } catch (error) {
            if (error && error.message === 'extract-zip is still installed') throw error;
            if (!error || error.code !== 'MODULE_NOT_FOUND') throw error;
          }
          NODE
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_status=$?
          set -e
          node - <<'NODE'
          const report = require('/tmp/npm-audit.json');
          const names = Object.keys(report.vulnerabilities ?? {});
          if (names.includes('extract-zip')) throw new Error('extract-zip remains in npm audit');
          console.log(`Remaining audit findings: ${names.length ? names.join(', ') : 'none'}`);
          NODE
          echo "npm audit status after extract-zip removal: $audit_status"

      - name: Commit validated patch
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          for required in package-lock.json packages/coding-agent/package.json packages/coding-agent/src/utils/tools-manager.ts packages/coding-agent/test/tools-manager.test.ts; do
            echo "$changed" | grep -Fx "$required"
          done
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/coding-agent/package.json packages/coding-agent/src/utils/tools-manager.ts packages/coding-agent/test/tools-manager.test.ts
          git commit -m "security: replace vulnerable ZIP extractor"
          git push origin HEAD:security/remove-extract-zip
