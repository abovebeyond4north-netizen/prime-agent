name: Recursive AI laboratory

on:
  push:
    branches: [recursive-ai-lab, recursive-ai-meta-evaluation, recursive-ai-transfer-generalization]
    paths:
      - "recursive-ai/**"
      - ".github/workflows/recursive-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Controller and real sandbox tests
        working-directory: recursive-ai
        run: |
          docker info
          python3 -m unittest tests.test_lab tests.test_autonomy tests.test_model_adapter tests.test_expressions tests.test_meta_eval tests.test_transfer_eval tests.test_docker -v
      - name: Run search and verify promotion
        working-directory: recursive-ai
        run: |
          python3 main.py run --iterations 4 > "$RUNNER_TEMP/recursive-ai-telemetry.jsonl"
          python3 main.py status
          python3 - <<'PY'
          from memory.skill_store import MemoryEngine
          from core.rollback import VersionController
          store = MemoryEngine('.lab-state')
          checkpoint = store.current()
          assert checkpoint, 'No candidate was promoted'
          manifest = VersionController('.lab-state').read(checkpoint)
          report = manifest['binary_search']['report']
          assert report['passed'] and len(report['gates']) == 10
          assert all(gate['passed'] for gate in report['gates'])
          store.db.close()
          PY
      - name: Autonomous goal completion and acquired skill invocation
        working-directory: recursive-ai
        run: |
          python3 main.py autonomous --goal "algorithms toolkit" --tier 2 --max-attempts 32 --max-seconds 420 --max-model-calls 0 > "$RUNNER_TEMP/autonomous-telemetry.jsonl"
          python3 main.py research-status
          python3 main.py solve --skill gcd --arguments '[-12,18]'
          python3 main.py solve --skill count_occurrences --arguments '[[1,2,2,3],2]'
          python3 - <<'PY'
          import json
          import os
          from autonomy.controller import status
          result = status('.lab-state')[0]['summary']
          assert result['status'] == 'goal_reached', result
          assert result['coverage'] == 1.0
          assert len(result['certified_tasks']) == 12
          assert result['audit']['passed']
          assert result['model_calls'] == 0
          assert result['policy_mode'] == 'learned'
          assert result['policy_revisions'] > 0
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Autonomous research result\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
      - name: Held-out cross-family transfer smoke test
        working-directory: recursive-ai
        run: |
          python3 - <<'PY'
          import json
          import os
          from research.transfer_eval import run_transfer_evaluation
          report = run_transfer_evaluation(
              '.lab-state-transfer',
              train_goal='binary_search',
              holdout_goal='gcd',
              tier=1,
              replicates=1,
              base_seed=41,
              prior_strength=4.0,
              max_attempts=8,
              max_seconds=180,
              max_model_calls=0,
              max_containers=800,
          )
          assert set(report['config']['train_families']).isdisjoint(report['config']['holdout_families'])
          assert report['config']['transfer_boundary'] == 'aggregate_operator_evidence_only'
          assert len(report['training_trials']) == 1
          assert len(report['holdout_trials']) == 3
          assert all(row['goal_reached'] and row['audit_passed'] for row in report['holdout_trials'])
          transferred = [row for row in report['holdout_trials'] if row['mode'] == 'learned_transfer'][0]
          scratch = [row for row in report['holdout_trials'] if row['mode'] == 'learned_scratch'][0]
          assert transferred['policy_prior_digest'] is not None
          assert scratch['policy_prior_digest'] is None
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Cross-family transfer smoke result\n\n```json\n' + json.dumps(report['summary'], indent=2) + '\n```\n')
          PY
      - name: Generate compound tasks, certify, and reuse after restart
        working-directory: recursive-ai
        run: |
          python3 main.py autonomous --goal "compound arithmetic" --tier 2 --task-seed 73 --task-count 3 --max-attempts 16 --max-seconds 240 --max-model-calls 0 > "$RUNNER_TEMP/compound-telemetry.jsonl"
          python3 - <<'PYTHON'
          import json
          import os
          from autonomy.controller import execute_goal, solve, status
          from autonomy.tasks import task_from_key
          result = status('.lab-state')[-1]
          summary = result['summary']
          assert summary['status'] == 'goal_reached', summary
          assert summary['coverage'] == 1.0 and len(summary['certified_tasks']) == 7
          assert summary['audit']['passed'] and summary['model_calls'] == 0
          assert execute_goal('.lab-state', 'compound arithmetic', tier=2, task_seed=73, task_count=3) == summary
          for descriptor in result['contract']['tasks']:
              task = task_from_key(descriptor['key'])
              answer = solve('.lab-state', task.family, [-12, 18])
              assert answer['output'] == task.expected([(-12, 18)])[0]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Compound curriculum result\n\n```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          print(json.dumps(summary, indent=2))
          PYTHON
