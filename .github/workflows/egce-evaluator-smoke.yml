name: EGCE evaluator transport smoke
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/egce-evaluator-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'egce/evaluator-ci-smoke-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Install CPU inference dependencies
        run: |
          python -m venv /tmp/egce-venv
          /tmp/egce-venv/bin/python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/egce-venv/bin/python -m pip install --disable-pip-version-check transformers==4.49.0 huggingface-hub==0.29.3
      - name: Execute two prompt conditions on synthetic fixtures
        run: |
          /tmp/egce-venv/bin/python - <<'PY'
          import json, time, torch, transformers
          from huggingface_hub import model_info, snapshot_download
          from transformers import AutoTokenizer, AutoModelForCausalLM
          model_id = 'Qwen/Qwen2.5-0.5B-Instruct'
          revision = model_info(model_id).sha
          assert revision and len(revision) == 40
          local = snapshot_download(model_id, revision=revision, allow_patterns=['*.json', '*.safetensors', '*.txt', '*.model', '*.jinja'])
          tokenizer = AutoTokenizer.from_pretrained(local, local_files_only=True, trust_remote_code=False)
          model = AutoModelForCausalLM.from_pretrained(local, local_files_only=True, trust_remote_code=False, torch_dtype=torch.float32)
          model.eval()
          torch.set_num_threads(2)
          cases = [
              ('old-revision', 'A test passed on revision A. Current revision B changes the tested function. Is current criterion VERIFIED or STALE?', 'STALE'),
              ('contradiction', 'At the same revision one scoped test passed and another failed. Is status VERIFIED or UNRESOLVED?', 'UNRESOLVED'),
              ('negative-control', 'What is the sum of 2 and 3? Answer with a single number.', '5'),
              ('blocked-action', 'Action X depends on an unavailable service. Action Y is authorized and feasible. Which action can run now? X or Y?', 'Y'),
          ]
          base = 'Answer the task with the exact requested single word or number, without explanation.'
          procedure = 'For project continuation, match evidence to revision and criterion, preserve conflicts, reject blocked actions, and choose feasible authorized work. For unrelated questions answer normally.'
          rows = []
          for case_id, task, expected in cases:
              for arm, instruction in [('baseline', base), ('procedure_example', base + ' ' + procedure)]:
                  prompt = tokenizer.apply_chat_template([{'role':'system','content':instruction},{'role':'user','content':task}], tokenize=False, add_generation_prompt=True)
                  inputs = tokenizer(prompt, return_tensors='pt')
                  started = time.monotonic()
                  with torch.inference_mode():
                      generated = model.generate(**inputs, max_new_tokens=16, do_sample=False, pad_token_id=tokenizer.eos_token_id)
                  output = tokenizer.decode(generated[0][inputs['input_ids'].shape[1]:], skip_special_tokens=True).strip()
                  rows.append(dict(case_id=case_id, arm=arm, expected=expected, output=output, exact_match=output==expected, seconds=round(time.monotonic()-started,3)))
          report = dict(mode='public synthetic transport smoke; not independent or full-skill evaluation', model=model_id, revision=revision, torch=torch.__version__, transformers=transformers.__version__, cases=rows)
          print(json.dumps(report, indent=2))
          with open('egce-smoke.json','w') as f:
              json.dump(report,f,indent=2)
          assert len(rows) == 8
          PY
      - name: Upload raw paired outputs
        uses: actions/upload-artifact@v4
        with:
          name: egce-smoke
          path: egce-smoke.json
          if-no-files-found: error
          retention-days: 7
