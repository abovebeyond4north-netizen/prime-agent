name: Finalize Prime Agent benchmarks

on:
  workflow_run:
    workflows: [Prime Agent benchmarks]
    types: [completed]

permissions: {}

jobs:
  cleanup:
    if: contains(fromJSON('["pull_request_target", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - name: Check whether sandbox execution could have started
        id: sandbox_state
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          marker_name="benchmark-cleanup-required-${RUN_ATTEMPT}"
          marker_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts | map(select(.name == \"${marker_name}\")) | length")
          if [ "$marker_count" -gt 0 ]; then
            echo "started=true" >> "$GITHUB_OUTPUT"
            echo "Trusted cleanup marker found; sandbox execution may have started."
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
            echo "No cleanup marker exists; sandbox execution never reached its start boundary."
          fi
      - name: Download benchmark results for cleanup decision
        id: cleanup_results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: benchmark-results-${{ github.event.workflow_run.run_attempt }}
          path: scripts/benchmarks/results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Determine whether cleanup is possible
        id: cleanup_state
        working-directory: scripts/benchmarks
        env:
          RESULTS_OUTCOME: ${{ steps.cleanup_results.outcome }}
          SANDBOX_RUN_STARTED: ${{ steps.sandbox_state.outputs.started }}
        run: |
          skip=false
          args=()
          if [ "$SANDBOX_RUN_STARTED" != true ]; then
            args+=(--sandbox-run-not-started)
          fi
          if [ "$RESULTS_OUTCOME" = success ] || [ "$SANDBOX_RUN_STARTED" != true ]; then
            skip=$(python3 cleanup_state.py results/report.json "${args[@]}")
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "Trusted evidence proves sandbox cleanup is unnecessary."
          else
            echo "Cleanup remains required; missing or ambiguous evidence will not suppress cleanup."
          fi
      - name: Install benchmark tooling
        if: steps.cleanup_state.outputs.skip != 'true'
        run: |
          python3 -m venv .benchmark-bootstrap
          .benchmark-bootstrap/bin/pip install uv==0.12.13
          .benchmark-bootstrap/bin/uv sync --locked --project scripts/benchmarks
          echo "$PWD/.benchmark-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Delete remaining run sandboxes
        if: steps.cleanup_state.outputs.skip != 'true'
        working-directory: scripts/benchmarks
        run: uv run --locked cli.py cleanup
        env:
          PRIME_SANDBOX_API_KEY: ${{ secrets.PRIME_SANDBOX_API_KEY }}
          PRIME_TEAM_ID: ${{ vars.PRIME_BENCHMARK_TEAM_ID }}

  publish:
    if: contains(fromJSON('["pull_request_target", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: prime-agent-benchmark-comment-${{ github.event.workflow_run.display_title }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - name: Download request
        id: request
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: benchmark-request-${{ github.event.workflow_run.run_attempt }}
          path: scripts/benchmarks/request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download results
        if: steps.request.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: benchmark-results-${{ github.event.workflow_run.run_attempt }}
          path: scripts/benchmarks/results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install benchmark tooling
        if: steps.request.outcome == 'success'
        run: |
          python3 -m venv .benchmark-bootstrap
          .benchmark-bootstrap/bin/pip install uv==0.12.13
          .benchmark-bootstrap/bin/uv sync --locked --project scripts/benchmarks
          echo "$PWD/.benchmark-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Publish the current result
        if: steps.request.outcome == 'success'
        working-directory: scripts/benchmarks
        run: uv run --locked cli.py finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
