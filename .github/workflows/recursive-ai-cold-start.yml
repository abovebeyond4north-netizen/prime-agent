name: Recursive AI empty state comparison
on:
  push:
    branches: [recursive-ai/procedure-memory-ablation]
    paths: [".github/workflows/recursive-ai-cold-start.yml", "recursive-ai/research/cold_start.py", "recursive-ai/tests/test_cold_start.py"]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [230006, 230007, 230008]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Check comparison boundaries
        working-directory: recursive-ai
        run: python3 -m unittest tests.test_cold_start -v
      - name: Compare empty state acquisition
        working-directory: recursive-ai
        env:
          STUDY_SEED: ${{ matrix.seed }}
        run: |
          mkdir cold-start-evidence
          python3 -m research.cold_start --seed "$STUDY_SEED" --state cold-start-evidence/state --output cold-start-evidence/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cold-start-${{ matrix.seed }}
          path: recursive-ai/cold-start-evidence/**
          if-no-files-found: error
          retention-days: 30
