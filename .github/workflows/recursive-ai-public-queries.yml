name: Recursive AI public query acquisition
on:
  push:
    branches: [recursive-ai/procedure-memory-ablation]
    paths: [".github/workflows/recursive-ai-public-queries.yml", "recursive-ai/research/public_queries.py", "recursive-ai/research/query_study.py", "recursive-ai/tests/test_public_queries.py"]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [720016, 720017, 720018]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Check public information boundaries
        working-directory: recursive-ai
        run: python3 -m unittest tests.test_public_queries -v
      - name: Compare public query policies
        working-directory: recursive-ai
        env:
          STUDY_SEED: ${{ matrix.seed }}
        run: |
          mkdir query-evidence
          python3 -m research.query_study --seed "$STUDY_SEED" --state query-evidence/state --output query-evidence/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-queries-${{ matrix.seed }}
          path: recursive-ai/query-evidence/**
          if-no-files-found: error
          retention-days: 30
