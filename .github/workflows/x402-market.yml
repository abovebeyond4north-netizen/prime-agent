name: x402 market tools

on:
  push:
    paths:
      - "tools/x402-market/**"
      - "tools/x402-provider/**"
      - ".github/workflows/x402-market.yml"
  pull_request:
    paths:
      - "tools/x402-market/**"
      - "tools/x402-provider/**"
      - ".github/workflows/x402-market.yml"

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tools/x402-market/tests -v

  provider:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/x402-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install provider dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Verify x402 exports
        run: |
          node --input-type=module -e '
            const cdp = await import("@coinbase/cdp-sdk/x402");
            const x402 = await import("@x402/express");
            if (typeof cdp.createX402Server !== "function") throw new Error("createX402Server export missing");
            if (typeof x402.paymentMiddlewareFromHTTPServer !== "function") throw new Error("paymentMiddlewareFromHTTPServer export missing");
          '
