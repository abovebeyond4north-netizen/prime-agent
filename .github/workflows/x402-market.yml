name: x402 market tools

on:
  push:
    paths:
      - "tools/x402-market/**"
      - "tools/x402-provider/**"
      - ".github/workflows/x402-market.yml"
      - ".github/workflows/x402-market-daily.yml"
  pull_request:
    paths:
      - "tools/x402-market/**"
      - "tools/x402-provider/**"
      - ".github/workflows/x402-market.yml"
      - ".github/workflows/x402-market-daily.yml"

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check
        run: python3 -m py_compile tools/x402-market/market_scan.py tools/x402-market/daily_snapshot.py
      - name: Unit tests
        run: python3 -m unittest discover -s tools/x402-market/tests -v

  provider:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/x402-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install provider dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Verify x402 exports
        run: |
          node --input-type=module -e '
            const cdp = await import("@coinbase/cdp-sdk/x402");
            const x402 = await import("@x402/express");
            if (typeof cdp.createX402Server !== "function") throw new Error("createX402Server export missing");
            if (typeof x402.paymentMiddlewareFromHTTPServer !== "function") throw new Error("paymentMiddlewareFromHTTPServer export missing");
          '
