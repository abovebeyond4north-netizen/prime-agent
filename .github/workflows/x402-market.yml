name: x402 market tools

on:
  push:
    paths:
      - "tools/x402-market/**"
      - "tools/x402-provider/**"
      - ".github/workflows/x402-market.yml"
      - ".github/workflows/x402-market-daily.yml"
      - ".github/workflows/x402-production-smoke.yml"
  pull_request:
    paths:
      - "tools/x402-market/**"
      - "tools/x402-provider/**"
      - ".github/workflows/x402-market.yml"
      - ".github/workflows/x402-market-daily.yml"
      - ".github/workflows/x402-production-smoke.yml"

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check
        run: python3 -m py_compile tools/x402-market/market_scan.py tools/x402-market/daily_snapshot.py
      - name: Unit tests
        run: python3 -m unittest discover -s tools/x402-market/tests -v

  provider:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/x402-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install provider dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax check
        run: npm run check
      - name: JavaScript unit tests
        run: npm test
      - name: Smoke checker syntax check
        run: python3 -m py_compile smoke_check.py
      - name: Smoke checker unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify x402 exports
        run: |
          node --input-type=module -e '
            const core = await import("@x402/core/server");
            const evm = await import("@x402/evm/exact/server");
            const express = await import("@x402/express");
            const bazaar = await import("@x402/extensions/bazaar");
            if (typeof core.HTTPFacilitatorClient !== "function") throw new Error("HTTPFacilitatorClient export missing");
            if (typeof evm.ExactEvmScheme !== "function") throw new Error("ExactEvmScheme export missing");
            if (typeof express.paymentMiddleware !== "function") throw new Error("paymentMiddleware export missing");
            if (typeof express.x402ResourceServer !== "function") throw new Error("x402ResourceServer export missing");
            if (typeof bazaar.declareDiscoveryExtension !== "function") throw new Error("declareDiscoveryExtension export missing");
            if (typeof bazaar.validateDiscoveryExtension !== "function") throw new Error("validateDiscoveryExtension export missing");
            if (typeof bazaar.bazaarResourceServerExtension !== "object") throw new Error("bazaarResourceServerExtension export missing");
          '
