name: x402 production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/x402-provider/**"
      - ".github/workflows/x402-production-smoke.yml"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: x402-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify production deployment and endpoint
        run: >
          python3 tools/x402-provider/smoke_check.py
          --url https://prime-agent-x402-provider.onrender.com
          --expected-commit "$GITHUB_SHA"
          --attempts 20
          --delay-seconds 15
