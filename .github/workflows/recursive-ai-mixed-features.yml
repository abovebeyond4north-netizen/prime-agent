name: Recursive AI mixed feature study
on:
  push:
    branches: [recursive-ai/procedure-memory-ablation]
    paths: [".github/workflows/recursive-ai-mixed-features.yml", "recursive-ai/research/mixed_features.py", "recursive-ai/tests/test_mixed_features.py"]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [330010, 330011, 330012]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Check inference boundaries
        working-directory: recursive-ai
        run: python3 -m unittest tests.test_mixed_features -v
      - name: Compare mixed feature grammar
        working-directory: recursive-ai
        env:
          STUDY_SEED: ${{ matrix.seed }}
        run: |
          mkdir mixed-feature-evidence
          python3 -m research.mixed_features --seed "$STUDY_SEED" --output mixed-feature-evidence/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mixed-features-${{ matrix.seed }}
          path: recursive-ai/mixed-feature-evidence/**
          if-no-files-found: error
          retention-days: 30
