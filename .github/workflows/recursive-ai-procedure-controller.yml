name: Recursive AI learned procedure controller
on:
  push:
    branches: [recursive-ai/selector-replications]
    paths: [".github/workflows/recursive-ai-procedure-controller.yml", "recursive-ai/autonomy/procedure.py", "recursive-ai/autonomy/controller.py", "recursive-ai/main.py", "recursive-ai/tests/test_procedure_controller.py"]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Verify controller acquisition, restart, transfer and rollback
        working-directory: recursive-ai
        run: python3 -m unittest tests.test_procedure_controller tests.test_scaffold_search -v
