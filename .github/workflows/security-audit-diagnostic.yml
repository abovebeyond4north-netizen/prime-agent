name: Security audit diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-audit:
    name: Capture npm audit evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Capture current audit
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          set +e
          npm audit --package-lock-only --json > /tmp/npm-audit-before.json
          before_status=$?
          set -e
          cat /tmp/npm-audit-before.json
          echo "pre-update audit exit status: ${before_status}"

      - name: Resolve only compatible patched versions
        run: |
          npm update vitest nanoid protobufjs --package-lock-only --ignore-scripts
          cp package-lock.json /tmp/package-lock.targeted.json
          echo "===== targeted lockfile diff ====="
          git diff -- package-lock.json
          echo "===== manifest drift check ====="
          test -z "$(git diff --name-only -- package.json packages/*/package.json)"

      - name: Verify targeted installed tree
        run: |
          npm ci --ignore-scripts
          npm ls vitest @vitest/mocker nanoid protobufjs --all
          set +e
          npm audit --json > /tmp/npm-audit-after.json
          after_status=$?
          set -e
          cat /tmp/npm-audit-after.json
          echo "post-update audit exit status: ${after_status}"

      - name: Upload targeted-update evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: npm-targeted-update-evidence
          path: |
            /tmp/package-lock.before.json
            /tmp/package-lock.targeted.json
            /tmp/npm-audit-before.json
            /tmp/npm-audit-after.json
          if-no-files-found: error
          retention-days: 7
