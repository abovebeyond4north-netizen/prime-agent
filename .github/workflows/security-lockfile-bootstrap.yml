name: Security lockfile normalize

on:
  push:
    branches:
      - security/patch-transitive-audit-findings

permissions:
  contents: write

jobs:
  normalize-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: security/patch-transitive-audit-findings
          fetch-depth: 0

      - name: Keep only targeted package records
        run: |
          git fetch origin main
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const current = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const base = JSON.parse(execFileSync('git', ['show', 'origin/main:package-lock.json'], { encoding: 'utf8' }));
          for (const key of ['node_modules/nanoid', 'node_modules/protobufjs']) {
            base.packages[key] = current.packages[key];
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(base, null, '\t') + '\n');
          NODE
          test "$(node -p "require('./package-lock.json').packages['node_modules/nanoid'].version")" = "3.3.19"
          test "$(node -p "require('./package-lock.json').packages['node_modules/protobufjs'].version")" = "7.6.6"
          test "$(git diff --numstat -- package-lock.json)" = $'6\t6\tpackage-lock.json'
          test "$(git diff --name-only)" = "package-lock.json"

      - name: Commit normalized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: minimize transitive audit patch"
          git push origin HEAD:security/patch-transitive-audit-findings
