name: Recursive AI scaffold configuration search
on:
  push:
    branches: [recursive-ai/selector-replications]
    paths: [".github/workflows/recursive-ai-scaffold-search.yml", "recursive-ai/research/scaffold_search.py", "recursive-ai/tests/test_scaffold_search.py"]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [490033, 590041, 690047]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Build isolated runner
        working-directory: recursive-ai
        run: docker build -t recursive-ai-runner:local sandbox/
      - name: Check procedure model boundaries
        working-directory: recursive-ai
        run: python3 -m unittest tests.test_scaffold_search -v
      - name: Learn and transfer procedure configuration
        working-directory: recursive-ai
        env:
          STUDY_SEED: ${{ matrix.seed }}
        run: |
          mkdir scaffold-search-evidence
          python3 -m research.scaffold_search --seed "$STUDY_SEED" --output scaffold-search-evidence/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scaffold-search-${{ matrix.seed }}
          path: recursive-ai/scaffold-search-evidence/**
          if-no-files-found: error
          retention-days: 30
